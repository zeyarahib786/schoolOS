      summary: List allergy care plans; parents see only plans for their linked children
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated allergy plans with student details } }
    post:
      summary: Create or update a student's allergy care plan (Administrator or Principal only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Allergy plan saved }
        '403': { description: Insufficient role }
  /cafeteria/menu:
    get:
      summary: List the weekly cafeteria menu in weekday order
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Weekly menu } }
  /cafeteria/menu/item:
    put:
      summary: Create or replace one meal slot without overwriting the day's other meals
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Menu item saved }
        '403': { description: Administrator or Principal required }
  /cafeteria/wallets/top-up:
    post:
      summary: Top up a student's wallet (Administrator, Principal, or Accountant only) - creates the wallet automatically on first use
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Wallet topped up }
        '403': { description: Insufficient role }
  /cafeteria/wallets/purchase:
    post:
      summary: Record a purchase with atomic wallet and ledger commit (finance roles)
      description: Positive two-decimal amount, description and studentId; optional wallet-scoped requestId makes identical retries idempotent. Recorded method/reference do not initiate payments. Integer-cent arithmetic and serialized student writes prevent overdrawing or duplicate first-use wallets.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Purchase recorded, balance decremented }
        '403': { description: Insufficient role }
        '409': { description: Insufficient wallet balance }

  # ---- Visitors - added this round ----
  /visitors:
    get:
      summary: >-
        List visitor log entries (paginated, filterable by status). Unlike every prior module,
        the ENTIRE module - both read and write - is gated to Administrator/Principal/Teacher at
        the router level, not just individual write routes. There is no ownership-scoping concept
        here at all (no Parent visibility), since a visitor log entry isn't "about" any
        particular student's guardian.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated visitor log, checkedInBy populated }
        '403': { description: Insufficient role - applies even to GET }
    post:
      summary: Check in a visitor (Administrator, Principal, or Teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Visitor checked in with status CheckedIn }
  /visitors/{id}/checkout:
    post:
      summary: Check out a visitor (Administrator, Principal, or Teacher only) - rejects an already-checked-out visitor
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Visitor checked out, checkedOutAt stamped }
        '409': { description: This visitor has already checked out }

  # ---- Biometric - added this round ----
  /biometric:
    get:
      summary: List biometric attendance devices - whole-module role gate like Visitors, no ownership concept
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Device list } }
    post:
      summary: Register a device (Administrator, Principal, or Teacher only) - starts Offline
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Device registered } }
  /biometric/{id}/sync:
    post:
      summary: Reject unconfigured hardware sync without changing device or attendance records
      description: No hardware connector is configured. Returns 409; neither Online nor lastSyncAt is fabricated.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '409': { description: Hardware connector is not configured }
        '404': { description: Device not found }

  # ---- Alumni - added this round ----
  /alumni:
    get:
      summary: List alumni profiles (paginated, filterable by graduation year)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated alumni list, student populated } }
  /alumni/graduate:
    post:
      summary: >-
        Graduate an active student (Administrator, Principal, or Teacher only). A THIRD
        transaction use case in this codebase (after Facilities' check-then-write and Inventory's
        multi-item all-or-nothing): cross-COLLECTION consistency - the Student's own `status`
        field flips to 'Alumni' and the new AlumniProfile is created together, or neither happens.
        Proven end-to-end: fetching the student afterward confirms status genuinely changed, not
        just that the alumni profile was created as a disconnected copy.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Student graduated, alumni profile created }
        '403': { description: Insufficient role }
        '404': { description: Student not found }
        '409': { description: This student has already graduated }

  # ---- LMS (Learning Management) - added this round ----
  /lms/assignments:
    get:
      summary: List assignments (paginated, filterable by subject/grade) - open to all authenticated roles
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated assignment list } }
    post:
      summary: Create an assignment (Administrator, Principal, or Teacher only)
      description: Optional remindersEnabled defaults false. Published coursework can generate pending-only reminders once in the 24 hours before and first 48 hours after its deadline. notifyEmail uses existing approval and provider gates.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Assignment created }
        '403': { description: Insufficient role }
  /lms/assignments/{id}/submit:
    post:
      summary: >-
        Submit an assignment - ONLY the Student role may submit, not even Administrator on a
        student's behalf; requires the requester's login account to be linked to a Student record
        via the studentUserId field (added to the Student model specifically for this module,
        closing a real pre-existing gap where nothing linked a Student-role login to their own
        record). Late detection is computed at submission time against the assignment's dueDate -
        a submission at the exact due instant is on time; even 1ms later is flagged isLate
        (boundary proven in unit tests). One submission per student per assignment, DB-enforced
        via a unique compound index - a duplicate attempt gets a real 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Submission recorded, isLate flag set }
        '400': { description: No student record linked to this account }
        '403': { description: Only a Student may submit }
        '404': { description: Assignment not found }
        '409': { description: Already submitted }
  /lms/submissions:
    get:
      summary: >-
        List submissions (optionally filtered by assignmentId). The first DUAL-RELATIONSHIP
        ownership scoping in this codebase: a Student sees only their OWN submissions (resolved
        via studentUserId), a Parent sees only their linked children's (resolved via
        guardianUserId) - the same scoping function applied to a per-role-resolved id list.
        Proven end-to-end for both relationships simultaneously in the integration suite.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'Submission list, student and assignment populated' } }
  /lms/submissions/{id}/grade:
    post:
      summary: >-
        Grade a submission (Administrator, Principal, or Teacher only). The score is validated
        against the assignment's own maxScore - a score exceeding it gets a real 400, not a
        silent clamp or acceptance.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Submission graded, status moves to Graded }
        '400': { description: Score exceeds the assignment maxScore }
        '404': { description: Submission not found }

  # ---- Timetable - added this round ----
  /timetable:
    get:
      summary: >-
        List timetable slots (filterable by grade/dayOfWeek). Staff can read drafts; Parent and
        Student accounts receive published slots only.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Slot list, sorted grade/day/period } }
    post:
      summary: >-
        Schedule a period (Administrator, Principal, or Teacher only). Database unique indexes
        prevent class, teacher, and room double-booking for the same day and period.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Period scheduled }
        '403': { description: Insufficient role }
        '409': { description: Class, teacher, or room conflict }
  /timetable/{id}:
    patch:
      summary: Edit subject, teacher, room, or substitute status; the grade returns to Draft
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Period updated }
        '403': { description: Insufficient role }
        '404': { description: Period not found }
        '409': { description: Teacher or room conflict }
    delete:
      summary: Mark a period free by deleting its scheduled slot
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Period removed }
        '403': { description: Insufficient role }
        '404': { description: Period not found }
  /timetable/publish:
    post:
      summary: Publish every scheduled period for one grade to Parent and Student accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Grade timetable published }
        '403': { description: Insufficient role }
        '404': { description: Grade has no scheduled periods }
  /timetable/swap:
    post:
      summary: Atomically swap two periods or move a scheduled period into a free position
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Periods swapped and grade returned to Draft }
        '403': { description: Insufficient role }
        '404': { description: Source period not found }
        '409': { description: Destination creates a teacher or room conflict }

  # ---- Announcements - added this round ----
  /announcements:
    get:
      summary: >-
        List announcements visible to the requester. A genuinely different access pattern from
        every prior module: visibility is declared BY THE CONTENT (each announcement names its
        audience: All/Staff/Parents/Students), and the read filter maps the requester's role to
        the audience set they may see. Parent sees All+Parents; Student sees All+Students.
        Only Published notices reach non-reviewers, except teachers also see their own drafts
        and pending notices. Administrator and Principal can review every status.
        Pinned announcements sort first.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated announcements, publishedBy populated } }
    post:
      summary: Create an announcement (Administrator, Principal, or Teacher)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Announcement created with Draft, Pending approval, or Published status }
        '403': { description: Insufficient role or Teacher attempted direct publish }
  /announcements/{id}/status:
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Pending approval, Published, Draft] }
                expectedUpdatedAt: { type: string, format: date-time }
                reviewNote: { type: string, maxLength: 300 }
      summary: Submit a draft for approval, approve it, or return a pending notice to draft
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Announcement status updated }
        '403': { description: Requester cannot perform this transition }
        '404': { description: Announcement not found }
        '409': { description: Current status does not allow this transition }

  # ---- Admissions - added this round ----
  /admissions:
    get:
      summary: List admission applications (paginated, filterable by status) - whole-module staff gate like Visitors
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated application list }
        '403': { description: Insufficient role - applies even to GET }
    post:
      summary: Record a new application (starts as Applied)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Application recorded } }
  /admissions/{id}/transition:
    post:
      summary: >-
        Progress an application through the pipeline. The first BRANCHING state machine in this
        codebase: forward path Applied -> Shortlisted -> Interviewed -> Accepted, with Rejected
        reachable at every active pipeline stage. Waitlist and restore preserve the existing
        UI workflow; required ID, birth certificate and photo are enforced before Accepted. Enrolled is
        deliberately NOT a valid transition target here - enrollment goes through the dedicated
        endpoint below, since it needs refId/roll and creates a real Student.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Application progressed }
        '400': { description: Invalid transition from the application's current status }
  /admissions/{id}/documents/{key}:
    put:
      summary: Upload or replace an existing admission document slot (Administrator, Principal, or Teacher)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string, enum: [id, birth, photo, report, immun, tc] } }]
      responses: { '201': { description: Document securely stored in GridFS } }
    get:
      summary: Download an admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Document content } }
    delete:
      summary: Remove an admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Document removed } }
  /admissions/{id}/documents/{key}/mark-received:
    post:
      summary: Record verified receipt of a paper admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Paper document receipt recorded } }
  /admissions/{id}/enroll:
    post:
      summary: >-
        Enroll an Accepted applicant - the symmetric MIRROR of Alumni's graduation transaction:
        creates a brand-new Student (carrying the application's own name/grade/gender/guardian/
        phone) and flips the application to Enrolled together, or neither happens. Proven both
        sides: the created Student is fetched back and its fields verified against the
        application's data; and a failed enrollment (duplicate refId, 409) provably leaves the
        application still Accepted - rolled back, not half-applied.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Applicant enrolled, Student created, application links to it }
        '400': { description: Only an Accepted application can be enrolled }
        '409': { description: A student with this refId already exists (transaction rolled back) }

  # ---- Leave (staff leave) - added this round ----
  /leave:
    get:
      summary: >-
        List leave requests. Approvers (Administrator/Principal) see all; everyone else sees only
        their own via their linked Staff record (Staff.userId, the Payroll/Expenses self-service
        shape) - and a requester with NO linked record matches nothing (fail closed), not
        everything.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated leave list, staff populated with balance } }
    post:
      summary: >-
        Request leave for yourself - any authenticated user with a linked Staff record; Administrator
        or Principal may submit the existing HR form for a selected active staff member. The day
        count is computed as an INCLUSIVE calendar count (same from/to date = 1 day; time-of-day
        stripped so 23:59 -> 00:01 is still 2 days) and STORED at request time like Payroll's
        netPay: an approved leave's size is a historical record that must not silently change if
        the counting rule ever does. Inverted ranges are rejected by a cross-field Zod refinement.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Leave requested, day count stored, status Pending }
        '400': { description: No linked staff record, or invalid range }
  /leave/{id}/decide:
    post:
      summary: >-
        Approve or deny a leave request. The approver gate (Administrator/Principal ONLY) is the
        first write-side rule that is a strict SUBSET of WRITE_ROLES - a Teacher can request but
        never decide. Self-approval prevention like Expenses, but stricter in one respect: an
        approver cannot decide their OWN request even to DENY it. Approval deducts the stored day
        count from the staff member's annualLeaveRemaining via Cafeteria's guarded-decrement
        technique ($gte guard + $inc in one findOneAndUpdate) applied at APPROVAL time - proven
        under real concurrency (two simultaneous approvals, exactly one lands, balance never
        negative) and proven to deduct exactly once across a double-decide attempt (409 on the
        second, balance unchanged). An insufficient balance fails the approval with 400 and the
        request stays Pending.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Decision recorded; balance deducted if approved }
        '400': { description: Insufficient leave balance }
        '403': { description: Not an approver, or deciding your own request }
        '409': { description: Already decided }

  # ---- Meetings (parent-teacher) - added this round ----
  /meetings:
    get:
      summary: >-
        List meeting slots (onlyOpen true/false filter). Leadership sees all, Parent sees open and
        own bookings, Teacher sees open and own linked staff bookings, other roles see open only.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated slot list, teacher and booked student populated } }
    post:
      summary: >-
        Publish a bookable slot (Administrator, Principal, or Teacher only). The same teacher
        must exist as teaching staff; Teacher may publish only their own linked staff slots. Cannot
        publish two slots at the same date+time - compound uniqueness preventing
        double-publication, 409 on conflict.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Slot published, open for booking }
        '409': { description: This teacher already has a slot at that date and time }
  /meetings/{id}/book:
    post:
      summary: >-
        Book an open slot - ONLY a Parent may book (mirroring LMS's only-Student-submits
        asymmetry), and only for a student genuinely linked to them via guardianUserId - resolved
        server-side, never trusted from the request body. The claim is Library's atomic-guard
        technique applied to booking: availability check and claim are ONE findOneAndUpdate
        guarded on bookedBy null, proven under a real two-parent race (exactly one 200, one 409).
        The failure path distinguishes a nonexistent slot (404) from an already-booked one (409)
        with a follow-up query made only on failure, keeping the happy path single-operation.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Slot booked for the parent's child }
        '403': { description: Not a Parent, or not your child }
        '404': { description: Meeting slot not found }
        '409': { description: Slot already booked }

  # ---- Documents (versioned registry) - added this round ----
  /documents:
    get:
      summary: >-
        List documents. By default shows ONLY the current version of each code; includeSuperseded
        reveals full version history. Filterable by category and code (case-normalized). Open
        read - policies, forms, and circulars exist to be consulted by everyone.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated document list, publishedBy populated } }
    post:
      summary: >-
        Publish a document (Administrator, Principal, or Teacher only). Publishing an existing
        code atomically supersedes its current version and creates version N+1 within a MongoDB
        replica-set transaction. A per-code counter serializes version assignment, and a partial
        unique index protects the single-current-version invariant. Failed publication rolls back
        both version changes. Optional expectedVersion rejects stale reviewed publications.
        Codes must look like POL-001 and are normalized to uppercase.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Version published as current; previous version superseded }
        '409': { description: Concurrent publish for this code - retry }
  /documents/file:
    post:
      summary: Publish a document version with an attached PDF (Administrator, Principal, Teacher)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string }, description: URI-encoded PDF filename }
        - { name: X-Document-Code, in: header, required: true, schema: { type: string } }
        - { name: X-Document-Title, in: header, required: true, schema: { type: string } }
        - { name: X-Document-Category, in: header, required: true, schema: { type: string, enum: [Policy, Form, Circular, Guideline] } }
        - { name: X-Document-Description, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Version and PDF stored }
        '400': { description: Invalid PDF or metadata }
        '403': { description: Not a publishing role }
  /documents/{id}/file:
    get:
      summary: Download an exact document version's PDF (all authenticated roles)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF attachment
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Record not found or no PDF attached }

  # ---- ID Cards - added this round ----
  /id-cards:
    get:
      summary: >-
        List ID cards (filterable by status/subjectType) - whole-module staff gate: cards carry
        personal data and issuance is front-office work. One collection spans BOTH holder kinds:
        the first POLYMORPHIC reference in this codebase (subjectType holds the literal model
        name, subject resolves through Mongoose refPath), so a single list interleaves cards
        whose holders populate from the Students and Staff collections respectively - proven
        end-to-end with both kinds in one response.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated card list, holder populated per record via refPath } }
    post:
      summary: >-
        Issue a card. Holder existence is checked in the RIGHT collection (a real Staff id passed
        as a Student subject is a 404, proven); expiry must be in the future; serials are
        sequential via the Counter technique (CARD-YYYY-000001). One ACTIVE card per holder,
        enforced with the partial-unique technique (recognized from Documents, reused): the
        holder's full Lost/Revoked history coexists while a second Active issuance gets 409. A
        fresh issuance genuinely links `replaces` to the holder's most recent Lost/Revoked card,
        making a card's lineage traceable - proven end-to-end (report lost -> reissue -> the new
        card's replaces equals the lost card's id).
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Card issued Active, serial assigned, lineage linked }
        '400': { description: Expiry in the past }
        '404': { description: Holder not found in the specified collection }
        '409': { description: Holder already has an active card }
  /id-cards/{id}/report-lost:
    post:
      summary: Report an Active card lost - only Active cards can be reported (409 otherwise, proven for the double-report case)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Card marked Lost; the holder can now be issued a replacement }
        '409': { description: Card is not Active }
  /id-cards/{id}/revoke:
    post:
      summary: Revoke an Active card (same Active-only rule as report-lost)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Card revoked }
        '409': { description: Card is not Active }

  # ---- Reports - added this round ----
  /reports/overview:
    get:
      summary: >-
        School-wide overview - the first true CROSS-COLLECTION read aggregation in this codebase:
        five independent $group pipelines (Students by status with $avg gpa/attendance over
        Active students, Staff by type, Invoices by status with amounts summed, Tickets by
        status, Attendance by month) run in parallel and composed. Monthly attendance rates
        cover the latest six months; Excused marks are excluded from the denominator and
        months without eligible marks have a null rate. Averages are computed by the DATABASE, not by
        loading documents into application memory. Also the first management-only READ: the
        Administrator/Principal subset Leave uses for its write side, applied to reading - even a
        Teacher gets 403 (proven). Aggregation correctness proven over real created data: two
        students -> Active count 2 with numeric averages; one 2500 invoice -> Pending count 1,
        totalAmount 2500.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Composed overview across students, staff, fees, helpdesk }
        '403': { description: Only Administrator or Principal }

  # ---- Settings - added this round ----
  /settings:
    get:
      summary: >-
        School-wide settings - the first SINGLETON document in this codebase (fixed string _id,
        the Counter model's string-_id technique applied to "exactly one of this thing"). GET
        before any save returns honest defaults rather than a 404 every client would special-case.
        Open read: school name and academic year are basic context for everyone.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current settings or defaults } }
    put:
      summary: >-
        Update settings - the first ADMINISTRATOR-ONLY gate in this codebase: even Principal gets
        403 (proven), because school-wide configuration has system-wide blast radius. The write is
        an upsert against the fixed _id, so two saves provably leave exactly ONE document with the
        latest values. Every change is written to the audit log as a Warning naming the Settings
        module and the actor server-side - proven end-to-end by reading the entry back through
        the Audit module's own API.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings saved (created on first save); audit entry written }
        '400': { description: Invalid payload (e.g. malformed academic year) }
        '403': { description: Only an Administrator }

  # ---- Messages - added this round (FINAL module, 36 of 36) ----
  /messages:
    get:
      parameters:
        - { name: box, in: query, schema: { type: string, enum: [inbox, sent, all], default: all } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
      summary: >-
        List your correspondence. BIDIRECTIONAL $or ownership - you see a message iff you are its
        sender OR its recipient - with, uniquely in this codebase, NO administrative override:
        the scoping function takes no role parameter at all, so an Administrator's view is
        exactly as narrow as anyone else's (proven: an Administrator cannot see a message between
        two other users). Box filter: inbox (recipient=you), sent (sender=you), all ($or).
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'Paginated messages, both parties populated' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientEmail, subject, body]
              properties:
                recipientEmail: { type: string, format: email }
                subject: { type: string, minLength: 1, maxLength: 160 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                replyTo: { type: string, description: Originating message ID; both users must be its participants }
      summary: >-
        Send a message by recipient email. A nonexistent recipient is 404; messaging yourself is
        400. Inactive or suspended recipient accounts are rejected. No role gate - every authenticated user can correspond.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Message sent, unread }
        '400': { description: Cannot message yourself }
        '404': { description: No user with that email }
  /messages/{id}/read:
    post:
      summary: >-
        Mark a message read - ONLY the recipient. The sender gets 403; a NON-PARTY (even an
        Administrator) gets 404 rather than 403, because for a non-party the message is
        indistinguishable from nonexistent - a 403 would leak that it exists. Both distinctions
        proven. Idempotent: marking an already-read message returns it unchanged.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: readAt set (or already set) }
        '403': { description: Sender cannot mark their own message read }
        '404': { description: Not found, or not a party to it }
