  /transport/routes/{id}/assign:
    post:
      summary: >-
        Assign a student to a route (Administrator, Principal, or Teacher only). The capacity
        check and the assignment happen in a single atomic update comparing the current
        assigned-student count against the vehicle's capacity via $expr - proven safe under real
        concurrent requests for the last available seat (exactly one succeeds, verified in the
        integration test suite). Assigning the same student twice is a no-op, not a duplicate or
        an error.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Student assigned }
