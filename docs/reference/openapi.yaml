  /students/{id}/enrollment:
    patch:
      summary: Record a reviewed enrollment status change with reason and history (Administrator or Principal)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Updated student }, '409': { description: Stale version or blocked status change } }
  /students/{id}/accounts:
    patch:
      summary: Explicitly link existing active family accounts (Administrator or Principal)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Updated student account links }, '400': { description: Invalid role or account } }
  /lms/courses:
    get:
      summary: List actual saved LMS courses
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Course list } }
    post:
      summary: Create a saved LMS course (authorized staff)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Course created }, '403': { description: Insufficient role } }
  /inbox:
    get:
      summary: List the authenticated user's personal notification history
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: unread, schema: { type: string, enum: ['true', 'false'] } }
      responses: { '200': { description: Personal events with pagination and unread count } }
  /inbox/read-all:
    post:
      summary: Mark only the authenticated user's notifications read
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Read state persisted } }
  /inbox/{id}/read:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Mark an owned notification read
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Saved notification }, '404': { description: Missing or another recipient's event } }
  /crm/assignees:
    get:
      summary: List active leadership accounts eligible for CRM assignment
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: CRM assignees }, '403': { description: Leadership only } }
  /crm/{id}/assign:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Assign a pipeline lead to an active CRM account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ownerId], properties: { ownerId: { type: string } } }
      responses: { '200': { description: Saved ownership }, '400': { description: Invalid assignee }, '409': { description: Archived or converted lead } }
  /crm/{id}/complete-follow-up:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Complete an active follow-up with an outcome note
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 400 } } }
      responses: { '200': { description: Saved activity and cleared follow-up }, '409': { description: No active follow-up } }
  /crm/{id}/email:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Queue a Resend email to the saved prospect guardian address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body, idempotencyKey]
              properties:
                subject: { type: string, minLength: 1, maxLength: 160 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
      responses: { '201': { description: Persisted queue record, not a delivery receipt }, '409': { description: Idempotency conflict }, '503': { description: Configure Resend first } }

  /crm/bulk-email:
    post:
      summary: Queue reviewed guardian emails (Administrator or Principal only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipients, subject, body, idempotencyKey]
              properties:
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, email]
                    properties:
                      id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      email: { type: string, format: email, maxLength: 254 }
                subject: { type: string, minLength: 1, maxLength: 160 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '201': { description: Batch ID and per-recipient status/deliveryId or skipped reason; not proof of delivery }
        '409': { description: Batch key reused for another payload }
        '503': { description: Resend unconfigured }
  /crm/{id}/deliveries:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Latest 100 delivery summaries for this enquiry (leadership only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Saved summaries without message body or idempotency secrets }
        '404': { description: Enquiry not found }

  /lms/teaching-options:
    get:
      summary: Active teacher accounts and active class sections (leadership only)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Teachers and class options }, '403': { description: Leadership required } }
  /lms/teaching-assignments:
    get:
      summary: Teaching mappings; Teacher sees own active class mappings only
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Mapped class, teacher, subject, year and active state } }
    post:
      summary: Assign or reactivate a teacher mapping (leadership only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacher, classSection, subject, academicYear]
              properties:
                teacher: { type: string, description: Active Teacher User ID }
                classSection: { type: string, description: Active ClassSection ID }
                subject: { type: string, minLength: 1, maxLength: 80 }
                academicYear: { type: string, description: Consecutive academic year e.g. 2026-2027 }
      responses: { '201': { description: Saved account-backed mapping }, '400': { description: Invalid teacher or section } }
  /lms/teaching-assignments/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Change mapping active state with optimistic concurrency (leadership only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, expectedUpdatedAt]
              properties:
                active: { type: boolean }
                expectedUpdatedAt: { type: string, format: date-time }
      responses: { '200': { description: Updated teaching mapping }, '409': { description: Stale mapping } }
  /lms/templates:
    get:
      summary: Latest 100 templates; Teacher sees own and school-shared templates
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Saved coursework templates } }
    post:
      summary: Save coursework template; only leadership can share school-wide
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, title, description, subject, maxScore]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                title: { type: string, minLength: 2, maxLength: 160 }
                description: { type: string, minLength: 1, maxLength: 2000 }
                subject: { type: string, minLength: 1, maxLength: 80 }
                maxScore: { type: number, minimum: 1, maximum: 10000 }
                acceptLate: { type: boolean, default: true }
                shared: { type: boolean, default: false }
      responses: { '201': { description: Saved template, no publication or delivery } }
  /lms/templates/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Delete owned template or leadership-managed template
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Deleted }, '404': { description: Template unavailable } }
  /lms/assignments/batch:
    post:
      summary: Atomic multi-section assignments with retry identity (teaching roles)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment, grades, idempotencyKey]
              properties:
                assignment:
                  type: object
                  required: [title, description, subject, grade, dueDate, maxScore]
                  description: Same validated fields as assignment creation. status supports Draft/Scheduled/Published/Closed. publishAt requires an ISO timestamp with offset for Scheduled; notifyEmail and remindersEnabled default false.
                grades:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 60 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '201': { description: Saved assignments, one per distinct authorized section }
        '403': { description: Teacher target scope not assigned }
        '409': { description: Batch key reused for different content }
  /lms/ai/status:
    get:
      summary: Teacher AI configuration status (teaching roles; no credentials)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Enabled, configured, model and setup reason }, '403': { description: Teaching role required } }
  /lms/ai/students:
    get:
      summary: Active students in a currently authorised teaching context
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: grade, required: true, schema: { type: string } }
        - { in: query, name: subject, required: true, schema: { type: string } }
        - { in: query, name: academicYear, required: true, schema: { type: string } }
      responses: { '200': { description: Student ids, names and references }, '403': { description: Teaching scope unavailable } }
  /lms/ai/drafts:
    get:
      summary: Latest 50 private accessible teacher AI draft summaries
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Author-owned draft summaries } }
    post:
      summary: Generate a private structured draft; never automatically execute
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, kind, grade, subject, academicYear, topic]
              properties:
                requestId: { type: string, format: uuid }
                kind: { type: string, enum: [Assignment, Quiz, LessonPlan, Feedback, ParentMessage, Progress] }
                grade: { type: string, maxLength: 60 }
                subject: { type: string, maxLength: 80 }
                academicYear: { type: string }
                topic: { type: string, minLength: 2, maxLength: 500 }
                instructions: { type: string, maxLength: 2000 }
                language: { type: string, enum: [English, Arabic], default: English }
                difficulty: { type: string, enum: [Support, Standard, Challenge], default: Standard }
                questionCount: { type: integer, minimum: 1, maximum: 20, default: 5 }
                maxScore: { type: integer, minimum: 1, maximum: 100, default: 20 }
                duration: { type: integer, minimum: 10, maximum: 180, default: 40 }
                reportDays: { type: integer, minimum: 7, maximum: 90, default: 30 }
                studentId: { type: string, description: Required for ParentMessage and Progress }
                submissionId: { type: string, description: Required for Feedback }
      responses:
        '201': { description: Persisted draft or existing generation reservation }
        '400': { description: Invalid input or generated content }
        '403': { description: Teaching role or scope unavailable }
        '409': { description: Request identity reused for different input }
        '429': { description: Generation quota or provider limit }
        '502': { description: Provider unavailable or invalid response }
        '503': { description: AI not configured }
  /lms/ai/drafts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Own accessible AI draft including private keys, source facts and warnings
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Draft }, '404': { description: Draft unavailable } }
    patch:
      summary: Save reviewed content using expectedUpdatedAt; Draft only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                content:
                  type: object
                  required: [title, body, questions, suggestedScore, warnings]
                  description: Validated bounded AI content. Question ids, choices, answers, rubrics and mark totals are checked. Same schema as generated content.
      responses: { '200': { description: Saved draft }, '400': { description: Invalid content }, '409': { description: Stale or applied draft } }
  /lms/ai/drafts/{id}/apply:
    post:
      summary: Apply one explicitly reviewed matching action atomically
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, reviewed, action]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                reviewed: { type: boolean, enum: [true] }
                action: { type: string, enum: [SaveAssignment, Grade, Message] }
                dueDate: { type: string, format: date-time }
                status: { type: string, enum: [Draft, Scheduled, Published], default: Draft }
                publishAt: { type: string, format: date-time }
                channel: { type: string, enum: [InApp, Email, SMS], default: InApp }
      responses:
        '200': { description: Applied draft with record id; identical retries return the same result }
        '400': { description: Review required or mismatched action/content }
        '403': { description: Teaching access revoked }
        '409': { description: Stale draft/submission or different replay options }
        '503': { description: External channel unconfigured }
