      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated inventory item }
        '409': { description: Adjustment would make stock negative }
        '403': { description: Insufficient role }
  /inventory/purchase-orders:
    get:
      summary: List purchase orders
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: PO list, line items populated } }
    post:
      summary: Raise a purchase order with one or more line items (Administrator, Principal, Teacher, or Accountant)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: PO created as Draft }
        '400': { description: A referenced inventory item does not exist }
        '403': { description: Insufficient role }
  /inventory/purchase-orders/{id}/send:
    post:
      summary: Move a PO from Draft to Sent (Administrator, Principal, Teacher, or Accountant)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: PO sent }
        '400': { description: Invalid transition from the PO's current status }
  /inventory/purchase-orders/{id}/receive:
    post:
      summary: >-
        Move a PO from Sent to Received, incrementing stock for EVERY line item in a single
        MongoDB transaction - a different transaction use case than Facilities' (all-or-nothing
        atomicity across MULTIPLE separate document updates, not a check-then-write). Proven
        correct for a real 3-item PO in the integration test suite: all three items' stock
        updates land together, exactly as expected. Received is a genuine terminal state - no
        transition back to Sent or Draft is ever allowed.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: PO received, all line items' stock updated atomically }
        '400': { description: Invalid transition from the PO's current status }
  /inventory/purchase-orders/{id}/cancel:
    post:
      summary: Cancel a Draft or Sent PO; Received and Cancelled POs are terminal
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: PO cancelled }
        '400': { description: Invalid transition from the PO's current status }

