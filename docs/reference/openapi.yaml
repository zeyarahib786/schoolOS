      responses: { '200': { description: Operational route status updated }, '409': { description: Vehicle is in maintenance } }
  /transport/routes/{id}/incidents:
    post:
      summary: Record an existing transport UI incident with audit severity
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
