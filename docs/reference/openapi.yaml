openapi: 3.0.3
info:
  title: Solvagence SchoolOS API
  version: 0.1.0
  description: >
    Production-oriented MERN API covering the active SchoolOS modules. Every response follows the same
    envelope: { success, data, meta } on 2xx, { success:false, error:{code,message,requestId} }
    on failure. Role-based and ownership-based authorization is enforced server-side.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

components:
  # ---- Staff module added this round - same pattern as Students, see /staff paths below ----
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FeeHeadInput:
      type: object
      required: [name, appliesTo, amount, frequency]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        appliesTo: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000000, multipleOf: 0.01 }
        frequency: { type: string, enum: [Annual, Term, One-time] }
        status: { type: string, enum: [Active, Archived], default: Active }
    Student:
      type: object
      properties:
        _id: { type: string }
        refId: { type: string, example: ANS-1042 }
        name: { type: string }
        grade: { type: string }
        gender: { type: string, enum: [Male, Female] }
        roll: { type: string }
        guardianName: { type: string }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string }
        guardianRelationship: { type: string, enum: [Father, Mother, Guardian, Other] }
        guardianEmail: { type: string, format: email }
        phone: { type: string }
        emergencyContact: { type: string }
        preferredLanguage: { type: string }
        address: { type: string }
        previousSchool: { type: string }
        previousGrade: { type: string }
        languages: { type: string }
        bloodGroup: { type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-] }
        allergies: { type: string }
        medicalNotes: { type: string }
        transportRequirement: { type: string, enum: [No, One-way, Two-way] }
        documents:
          type: array
          description: Metadata for authenticated files stored in the studentDocuments GridFS bucket.
          items:
            type: object
            properties:
              key: { type: string, enum: [id, birth, photo] }
              label: { type: string }
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer }
              uploadedAt: { type: string, format: date-time }
        feeStatus: { type: string, enum: [Paid, Pending, Overdue] }
        attendancePct: { type: number }
        gpa: { type: number }
        attendanceRecords: { type: integer, minimum: 0, readOnly: true, description: Number of linked attendance records used for the live summary. }
        assessmentResults: { type: integer, minimum: 0, readOnly: true, description: Number of linked assessment results used for the live summary. }
        invoiceRecords: { type: integer, minimum: 0, readOnly: true, description: Number of linked invoices used for the live summary. }
        status: { type: string, enum: [Active, Inactive, Alumni] }
    StaffMember:
      type: object
      properties:
        _id: { type: string }
        refId: { type: string, example: EMP-209 }
        name: { type: string }
        designation: { type: string }
        department: { type: string }
        type: { type: string, enum: [Teaching, Non-Teaching] }
        status: { type: string, enum: [Active, Onboarding, On Leave, Inactive] }
        email: { type: string }
        phone: { type: string }
        joinedDate: { type: string, format: date }
    AttendanceRecord:
      type: object
      properties:
        _id: { type: string }
        student: { type: string, description: 'ObjectId ref to Student, or a populated object with name/refId/grade' }
        date: { type: string, format: date }
        session: { type: string, enum: [AM, PM] }
        status: { type: string, enum: [Present, Absent, Late, Excused] }
        notes: { type: string }
    InvoiceInput:
      type: object
      required: [refId, studentId, term, amount, dueDate]
      properties:
        refId: { type: string, minLength: 1, maxLength: 30 }
        studentId: { type: string, description: Existing active student ObjectId }
        term: { type: string, minLength: 1, maxLength: 60 }
        amount: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000, multipleOf: 0.01 }
        currency: { type: string, minLength: 3, maxLength: 3, description: Must match school currency when supplied }
        dueDate: { type: string, format: date, description: Valid calendar date }
    Invoice:
      type: object
      properties:
        _id: { type: string }
        refId: { type: string, example: INV-1001 }
        student: { type: string, description: 'ObjectId ref to Student, or a populated object' }
        term: { type: string }
        amount: { type: number }
        currency: { type: string, example: AED }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [Pending, Paid, Overdue] }
        paymentMethod: { type: string, enum: [Card, Bank transfer, Cash, Cheque, Online portal] }
    CurriculumUnit:
      type: object
      properties:
        _id: { type: string }
        subject: { type: string }
        term: { type: string }
        title: { type: string }
        outcomes: { type: string }
        sequenceOrder: { type: integer }
        plannedDate: { type: string, format: date }
        completedDate: { type: string, format: date, nullable: true }
        framework: { type: string }
        owner: { type: string }
    ClassSection:
      type: object
      properties:
        _id: { type: string }
        grade: { type: string, example: Grade 6 }
        section: { type: string, example: A }
        className: { type: string, example: Grade 6 · A }
        stream: { type: string, enum: [Foundation, Primary, General, Commerce, Science, Arts] }
        teacherStaffId: { type: object, nullable: true, description: Populated active teaching Staff record }
        representativeStudentId: { type: object, nullable: true, description: Populated Student record }
        capacity: { type: integer, minimum: 1, maximum: 100 }
        filled: { type: integer, description: Live count of active Student records assigned to className }
    CrmLead:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        grade: { type: string }
        stage: { type: string, enum: [New, Contacted, Toured, Application, Won] }
        source: { type: string, enum: [Website, Walk-in, Referral, Agent, Event, Instagram, Facebook, Google] }
        phone: { type: string }
        guardian: { type: string }
        guardianEmail: { type: string, format: email }
        owner: { type: string }
        temperature: { type: string, enum: [Hot, Warm, Cold] }
        followUpDate: { type: string, format: date-time, nullable: true }
        followUpType: { type: string, nullable: true }
        archived: { type: boolean }
        archiveReason: { type: string, nullable: true }
        lastActivityAt: { type: string, format: date-time }
        activityLog: { type: array, items: { type: object } }
    Book:
      type: object
      properties:
        _id: { type: string }
        isbn: { type: string }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        totalCopies: { type: integer }
        availableCopies: { type: integer }
    Loan:
      type: object
      properties:
        _id: { type: string }
        book: { type: string, description: 'ObjectId ref to Book, or a populated object' }
        student: { type: string, description: 'ObjectId ref to Student, or a populated object' }
        issuedDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        returnedDate: { type: string, format: date }
        status: { type: string, enum: [Active, Returned, Overdue] }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    Guardian:
      type: object
      properties:
        _id: { type: string }
        refId: { type: string, example: GRD-101 }
        name: { type: string }
        relation: { type: string, enum: [Parent, Father, Mother, Guardian, Other] }
        phone: { type: string }
        email: { type: string, format: email }
        studentIds: { type: array, items: { type: object } }
        portalStatus: { type: string, enum: [Active, Invited, Suspended] }
        pickupAuthorized: { type: boolean }
        financialResponsible: { type: boolean }
        custody: { type: string }
        userId: { type: string, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        note: { type: string }
        consents:
          type: object
          properties:
            media: { type: boolean, nullable: true }
            trips: { type: boolean, nullable: true }
            medical: { type: boolean, nullable: true }
    GuardianFields:
      type: object
      required: [name, relation, phone, studentIds, pickupAuthorized, financialResponsible, custody, consents]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        relation: { type: string, enum: [Parent, Father, Mother, Guardian, Other] }
        phone: { type: string, pattern: '^\+?[0-9 ]{7,20}$' }
        email: { type: string, description: Optional contact email; empty string clears it; shared email is allowed }
        studentIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
        pickupAuthorized: { type: boolean }
        financialResponsible: { type: boolean }
        custody: { type: string, minLength: 1, maxLength: 300 }
        note: { type: string, maxLength: 600 }
        consents:
          type: object
          required: [media, trips, medical]
          properties:
            media: { type: boolean, nullable: true }
            trips: { type: boolean, nullable: true }
            medical: { type: boolean, nullable: true }
    GuardianCreate:
      allOf:
        - { $ref: '#/components/schemas/GuardianFields' }
        - type: object
          required: [refId]
          properties:
            refId: { type: string, minLength: 1, maxLength: 30 }
    GuardianUpdate:
      allOf:
        - { $ref: '#/components/schemas/GuardianFields' }
        - type: object
          required: [expectedUpdatedAt]
          properties:
            expectedUpdatedAt: { type: string, format: date-time }
    AccessRole:
      type: object
      required: [_id, name, isSystem, permissions]
      properties:
        _id: { type: string }
        name: { type: string, example: Teacher }
        description: { type: string }
        basedOn: { type: string, nullable: true }
        isSystem: { type: boolean }
        permissions:
          type: object
          additionalProperties: { type: boolean }
          example: { Students: true, Payroll: false, Settings: false }
paths:
  /staff:
    get:
      summary: >-
        List staff (paginated, searchable, filterable by department/type/status). Ownership-scoped:
        Administrator/Principal/Accountant see the full directory; any other role sees only their
        own linked staff record (matched via userId), if one exists.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated staff list }
    post:
      summary: Create a staff record (Administrator, Principal only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StaffMember' } }
      responses:
        '201': { description: Staff record created }
        '403': { description: Insufficient role }
        '409': { description: refId or email already exists }
  /staff/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a single staff record by id (ownership-scoped - see GET /staff)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Staff record found }
        '404': { description: Not found, or not yours to see }
    patch:
      summary: Versioned employee profile update (Administrator, Principal only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, changeReason]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                changeReason: { type: string, minLength: 3, maxLength: 500 }
                name: { type: string }
                department: { type: string }
                designation: { type: string }
                status: { type: string, enum: [Active, Onboarding, On Leave, Inactive] }
                joinedDate: { type: string, format: date }
                annualLeaveRemaining: { type: integer, minimum: 0, maximum: 366 }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
        '403': { description: Insufficient role }
    delete:
      summary: Delete a staff record (Administrator only; blocked when operational history exists)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '403': { description: Insufficient role }
        '409': { description: Staff has leave, payroll, claim, meeting, or ticket history; set Inactive instead }
  /staff/{id}/documents/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: key, in: path, required: true, schema: { type: string, enum: [id, degree, photo, experience, visa, attestation] } }
    put:
      summary: Securely upload an existing Staff onboarding document (Administrator or Principal)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Document stored in GridFS } }
    get:
      summary: Download a staff document within the staff-directory ownership scope
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Document stream } }
    delete:
      summary: Remove a staff document (Administrator or Principal)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Document removed } }
  /staff/{id}/onboarding/{key}/toggle:
    post:
      summary: Persist an existing onboarding checklist toggle (Administrator or Principal)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Updated staff record } }
  /attendance:
    get:
      summary: >-
        List attendance records (paginated, filterable by student/date/session/status). Ownership-
        scoped: Administrator/Principal/Teacher see all records; a Parent sees only records for
        their linked children and Student sees the linked student record. Requested student filters intersect ownership.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated attendance list, student field populated with name/refId/grade }
  /attendance/staff:
    get:
      summary: >-
        List staff self-attendance for a date. Administrator, Principal, and Accountant see all
        staff rows; Teacher sees only their own row.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Staff attendance list for the selected day }
        '403': { description: Non-staff role }
  /attendance/staff/me:
    put:
      summary: Mark or correct the signed-in staff user's attendance for the day.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                date: { type: string, format: date }
                status: { type: string, enum: [Present, Remote, Late] }
      responses:
        '200': { description: Staff attendance row saved }
        '403': { description: Non-staff role }
  /attendance/absence-requests:
    get:
      summary: >-
        List student absence requests. Administrator/Principal/Teacher see all; Parent sees only
        requests for linked children.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated absence request list }
    post:
      summary: Create an absence request for a linked student.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, fromDate, toDate, note]
              properties:
                studentId: { type: string }
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                type: { type: string, enum: [Medical, Family event, Travel, Religious observance, Other] }
                note: { type: string }
      responses:
        '201': { description: Absence request created in Pending status }
        '404': { description: Student not found or not linked to requester }
  /attendance/absence-requests/{id}/cancel:
    post:
      summary: Cancel a pending absence request.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Request cancelled }
        '409': { description: Request is no longer pending }
  /attendance/absence-requests/{id}/decision:
    post:
      summary: Transactionally decide a pending absence request; approval fills unmarked/Absent sessions as Excused and preserves Present/Late.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [Approved, Rejected] }
                note: { type: string }
      responses:
        '200': { description: Decision saved }
        '403': { description: Insufficient role }
        '409': { description: Request is no longer pending }
  /attendance/register:
    put:
      summary: Save a protected class register (Administrator, Principal or Teacher)
      description: Transactional batch of unique active students. Dates use school calendar days. Stale timestamps reject the whole batch; changing a saved status/note requires a correction reason. Optional notifyGuardians requests confirmed Absent/Late alerts for today only; Teacher requests require current-year class mapping and external delivery approval.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, session, entries]
              properties:
                date: { type: string, format: date }
                session: { type: string, enum: [AM, PM] }
                notifyGuardians: { type: boolean, default: false }
                notificationChannel: { type: string, enum: [InApp, Email, SMS], default: InApp }
                correctionReason: { type: string, maxLength: 300 }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, status, expectedUpdatedAt]
                    properties:
                      studentId: { type: string }
                      status: { type: string, enum: [Present, Absent, Late, Excused] }
                      notes: { type: string, maxLength: 300 }
                      expectedUpdatedAt: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Complete register saved and audited }
        '400': { description: Invalid/future day, duplicate/inactive students or missing correction reason }
        '403': { description: Insufficient role }
        '409': { description: Another editor changed a register entry }
  /attendance/mark:
    post:
      summary: >-
        Bulk-mark attendance for a whole class in one request (Administrator, Principal, or
        Teacher only). Rejects the entire batch with 409 if any (student, date, session)
        combination is already marked - enforced by a database-level unique index, not just
        application logic.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, session, entries]
              properties:
                date: { type: string, format: date }
                session: { type: string, enum: [AM, PM] }
                entries:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, status]
                    properties:
                      studentId: { type: string }
                      status: { type: string, enum: [Present, Absent, Late, Excused] }
                      notes: { type: string }
      responses:
        '201': { description: 'Attendance marked - returns { markedCount }' }
        '403': { description: Insufficient role }
        '409': { description: One or more students already marked for this date/session }
    put:
      summary: >-
        Save or correct a live class register idempotently (Administrator, Principal, or Teacher
        only). Existing (student, date, session) rows are updated, missing rows are created.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, session, entries]
              properties:
                date: { type: string, format: date }
                session: { type: string, enum: [AM, PM] }
                entries:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, status]
                    properties:
                      studentId: { type: string }
                      status: { type: string, enum: [Present, Absent, Late, Excused] }
                      notes: { type: string }
      responses:
        '200': { description: 'Register saved - returns { markedCount, updatedCount, createdCount }' }
        '403': { description: Insufficient role }
  /fees/heads:
    get:
      summary: List saved fee heads (Administrator/Principal/Accountant)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Reference price list }, '403': { description: Finance role required } }
    post:
      summary: Create a school-currency reference fee head
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/FeeHeadInput' } }
      responses: { '201': { description: Saved fee head } }
  /fees/heads/{id}:
    patch:
      summary: Versioned full-field fee head edit/archive
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/FeeHeadInput' }
                - type: object
                  required: [expectedUpdatedAt]
                  properties:
                    expectedUpdatedAt: { type: string, format: date-time }
      responses: { '200': { description: Saved head }, '409': { description: Stale version } }
  /exams/{id}:
    patch:
      summary: Save draft datesheet (teaching staff only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, schedule]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                schedule:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [subject, date, startTime, durationMinutes, venue]
                    properties:
                      subject: { type: string }
                      date: { type: string, format: date }
                      startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                      durationMinutes: { type: integer, minimum: 1, maximum: 480 }
                      venue: { type: string, minLength: 1, maxLength: 100 }
      responses: { '200': { description: Saved datesheet }, '409': { description: Stale or published scheme } }
  /exams/{id}/register:
    put:
      summary: Transactional versioned complete marks batch (teaching staff only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                correctionReason: { type: string, maxLength: 300, description: Required when saved scores change }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [studentId, scores, expectedUpdatedAt]
                    properties:
                      studentId: { type: string }
                      expectedUpdatedAt: { type: string, format: date-time, nullable: true }
                      scores:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [subject, marks]
                          properties:
                            subject: { type: string }
                            marks: { type: number, minimum: 0 }
      responses: { '200': { description: Saved count }, '400': { description: Incomplete/invalid marks or missing correction reason }, '403': { description: Role denied or published }, '409': { description: Stale editor; entire batch rolled back } }
  /announcements/audience-preview:
    get:
      summary: Active portal visibility counts including staff oversight (authors only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: audience, in: query, required: true, schema: { type: string, enum: [All, Staff, Parents, Students] } }]
      responses: { '200': { description: 'audience, visibleAccounts, byRole, channel and deliveryTracked=false' } }
  /announcements/{id}:
    patch:
      summary: Edit Draft content (author Teacher or Administrator/Principal reviewer)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, expectedUpdatedAt]
              properties:
                title: { type: string, minLength: 2, maxLength: 160 }
                body: { type: string, minLength: 1, maxLength: 3000 }
                audience: { type: string, enum: [All, Staff, Parents, Students], default: All }
                pinned: { type: boolean, default: false }
                expectedUpdatedAt: { type: string, format: date-time }
      responses: { '200': { description: Saved draft }, '409': { description: Stale/not-editable draft } }
  /messages/{id}/archive:
    post:
      summary: Personal archive or restore (participant only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses: { '200': { description: Personal archive state updated }, '404': { description: Missing message or non-party } }
  /fees:
    get:
      summary: >-
        List invoices (paginated, filterable by student/status). Ownership-scoped: Administrator/
        Principal/Accountant see all invoices; a Parent sees only their linked children's
        invoices; Teacher sees none (fees is deliberately the narrowest-access module - Teacher
        has no legitimate business need for financial data).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated invoice list }
    post:
      summary: Raise an invoice (Administrator, Principal, or Accountant only - NOT Teacher, unlike every other write-gated module)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } }
      responses:
        '201': { description: Invoice created }
        '403': { description: Insufficient role }
        '409': { description: refId already exists }
  /fees/payments:
    get:
      summary: List recorded fee payments (parent-scoped like invoices).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated payment ledger }
    post:
      summary: Record a student-level payment against the oldest unpaid invoice.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, amount, paymentMethod]
              properties:
                studentId: { type: string }
                amount: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000, multipleOf: 0.01 }
                paymentMethod: { type: string, enum: [Card, Bank transfer, Cash, Cheque, Online portal] }
                reference: { type: string }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100, description: Same recorder/key/details replay without another payment }
      responses:
        '200': { description: Payment recorded and invoice balance updated }
        '400': { description: Payment exceeds balance }
        '404': { description: No unpaid invoice found }
  /fees/reminders:
    post:
      summary: Save in-app fee reminders for selected outstanding invoices to active unsuspended linked Parents; an empty ID list sends none.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invoiceIds: { type: array, items: { type: string } }
      responses:
        '200': { description: Reminder processing counts }
  /fees/{id}/pay:
    post:
      summary: Record a full or partial payment against an invoice (Administrator, Principal, or Accountant only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                amount: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000000, multipleOf: 0.01 }
                paymentMethod: { type: string, enum: [Card, Bank transfer, Cash, Cheque, Online portal] }
                reference: { type: string }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100, description: Same recorder/key/details replay without another payment }
      responses:
        '200': { description: Payment recorded; invoice status/balance updated }
        '400': { description: Payment amount exceeds balance }
        '403': { description: Insufficient role }
        '404': { description: Not found }
  /curriculum:
    get:
      summary: >-
        List curriculum units (paginated, grade/year/term/subject/archive filters, searchable). No ownership
        restriction - every authenticated role, including Parent and Student, can read the
        curriculum.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated curriculum unit list }
    post:
      summary: Add a persisted curriculum unit (Administrator, Principal, or Teacher only)
      description: Units are unique by subject, term, title, grade and academic year (case-insensitive); creation is audited.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Unit created }
        '403': { description: Insufficient role }
        '409': { description: A matching unit already exists for the subject and term }
  /curriculum/subjects:
    get:
      summary: Distinct list of all subjects that have at least one curriculum unit
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Array of subject names }
  /curriculum/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update, complete, or reopen a curriculum unit (Administrator, Principal, or Teacher only)
      description: Requires expectedUpdatedAt and reason; records review history, rejects future completion and editing archived units.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
        '409': { description: Update would duplicate another unit }
    delete:
      summary: Remove an unused curriculum unit (Administrator, Principal, or Teacher only)
      description: Completed or reviewed units cannot be deleted; use leadership archive.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Removed }
  /classes:
    get:
      summary: List persisted class sections with live active-student roster counts
      description: Readable by every authenticated role; supports pagination, stream filtering, and grade/section search.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated class-section list }
    post:
      summary: Create a class section (Administrator, Principal, or Teacher only)
      description: Grade/section is case-insensitively unique. An assigned teacher must be active teaching staff, and capacity cannot be below the current active roster.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade, section]
              properties:
                grade: { type: string, example: Grade 6 }
                section: { type: string, pattern: '^[A-F]$' }
                stream: { type: string, enum: [Foundation, Primary, General, Commerce, Science, Arts] }
                teacherStaffId: { type: string }
                capacity: { type: integer, minimum: 1, maximum: 100, default: 30 }
                room: { type: string, maxLength: 60 }
      responses:
        '201': { description: Class section created and audited }
        '403': { description: Insufficient role }
        '404': { description: Assigned teacher not found }
        '409': { description: Duplicate section, invalid teacher state, or capacity below roster }
  /classes/{id}:
    patch:
      summary: Edit or archive/restore a section (Administrator or Principal)
      description: Section identity remains stable. Active teaching staff only; capacity must cover active roster; occupied sections cannot be archived. Stale edits return 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacity, stream, status, expectedUpdatedAt]
              properties:
                capacity: { type: integer, minimum: 1, maximum: 100 }
                stream: { type: string, enum: [Foundation, Primary, General, Commerce, Science, Arts] }
                room: { type: string, maxLength: 60 }
                teacherStaffId: { type: string, nullable: true }
                status: { type: string, enum: [Active, Archived] }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200': { description: Section updated and audited }
        '403': { description: Insufficient role }
        '404': { description: Section missing }
        '409': { description: Stale edit, occupied archive, invalid teacher or insufficient capacity }
  /crm:
    get:
      summary: List persisted CRM leads (Administrator or Principal only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated lead funnel }
        '403': { description: Insufficient role }
    post:
      summary: Capture a new lead with duplicate protection and audit logging
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Lead created }
        '409': { description: Lead already exists }
  /crm/{id}/advance:
    post:
      summary: Advance a lead by exactly one funnel stage
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lead advanced }
        '409': { description: Archived or already at final stage }
  /crm/{id}/follow-up:
    put:
      summary: Schedule the existing quick or custom follow-up
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Follow-up persisted }
  /crm/{id}/activity:
    post:
      summary: Log outreach or follow-up activity and optional temperature change
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Activity persisted }
  /crm/{id}/archive:
    post:
      summary: Archive a manual, stale, or lost lead with a reason
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lead archived }
  /crm/{id}/restore:
    post:
      summary: Restore an archived lead to the funnel
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lead restored }
  /crm/{id}/convert:
    post:
      summary: Convert an Application-stage lead into Admissions and mark it Won
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Admissions application created }
        '409': { description: Wrong stage or duplicate application }
  /crm/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    patch:
      summary: Edit an active unconverted enquiry with optimistic concurrency (leadership only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, grade, source, guardian, phone, guardianEmail, temperature, updatedAt]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                grade: { type: string, pattern: '^(KG [12]|Grade ([1-9]|1[0-2]))$' }
                source: { type: string, enum: [Website, Walk-in, Referral, Agent, Event, Instagram, Facebook, Google] }
                guardian: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 30 }
                guardianEmail: { type: string, maxLength: 254, description: Valid email or empty string to clear }
                temperature: { type: string, enum: [Hot, Warm, Cold] }
                updatedAt: { type: string, format: date-time }
      responses:
        '200': { description: Saved enquiry with new updatedAt }
        '409': { description: Stale version, inactive enquiry or duplicate identity }
    delete:
      summary: Permanently delete an already archived lead
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lead deleted }
        '409': { description: Lead must be archived first }
  /library/books:
    get:
      summary: List the book catalogue (paginated, searchable by title/author, filterable by category)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated book list with real-time availableCopies }
    post:
      summary: >-
        Add a new arrival, or restock an existing ISBN (Administrator, Principal, or Teacher only).
        Adding a book whose ISBN already exists in the catalogue increments its copy counts atomically
        rather than creating a duplicate record.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Book created or restocked }
        '403': { description: Insufficient role }
  /library/loans:
    get:
      summary: >-
        List loans (paginated, filterable by student/status). Ownership-scoped: Administrator/
        Principal/Teacher see all; a Parent sees only their linked children's loans.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated loan list, book and student populated }
    post:
      summary: >-
        Issue a loan (Administrator, Principal, or Teacher only). The availability check and the
        copy decrement happen in a single atomic database operation, not a separate read-then-write -
        verified under real concurrent requests in the integration test suite (two simultaneous
        requests for the last copy: exactly one succeeds, never both).
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Loan issued }
        '403': { description: Insufficient role }
        '409': { description: No copies currently available }
  /library/loans/{id}/return:
    post:
      summary: Process a return (Administrator, Principal, or Teacher only) - increments availableCopies back
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Loan marked Returned }
        '409': { description: This loan has already been returned }
  /library/requests:
    get:
      summary: List book requests; staff see all and students/parents see only linked student requests
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated book request list }
    post:
      summary: Create a book request for the authenticated Student or Parent's linked active student
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Request created }
        '409': { description: Duplicate pending request or inactive student }
  /library/requests/{id}/fulfill:
    post:
      summary: Mark a pending book request fulfilled (Administrator, Principal, or Teacher only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Request fulfilled }
        '409': { description: Request is already fulfilled }
  /library/reminders:
    post:
      summary: Send persisted in-app reminders for selected overdue loans (Administrator, Principal, or Teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reminder delivery totals; unlinked students are reported as skipped }
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                role: { type: string, enum: [Administrator, Principal, Teacher, Accountant, Parent, Student] }
      responses:
        '201': { description: User created, tokens issued }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful, tokens issued }
        '401': { description: Invalid credentials (generic message - no user enumeration) }
  /auth/refresh:
    post:
      summary: Exchange a valid refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: New token pair issued }
        '401': { description: Invalid, expired, or revoked refresh token }
  /auth/logout:
    post:
      summary: Log out - revokes all outstanding refresh tokens for this user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logged out }
        '401': { description: Missing or invalid access token }
  /auth/me:
    get:
      summary: Return the full authenticated user record, revalidated against the database (not just the JWT payload) - a deactivated account is rejected here even with an otherwise-valid token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Current user, full record (id, name, email, role)' }
        '401': { description: Missing/invalid access token, or the account has been deactivated since the token was issued }
  /roles/me:
    get:
      summary: Get the authenticated user’s persisted module-navigation grants
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current access role }
        '401': { description: Missing or invalid access token }
  /roles:
    get:
      summary: List the full permission matrix and active portal-account counts (Administrator only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Roles, governed modules, per-role counts, and total active users }
        '403': { description: Administrator required }
    post:
      summary: Create a permission template by cloning an existing role (Administrator only; templates are not account roles)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, basedOn]
              properties:
                name: { type: string }
                basedOn: { type: string }
                description: { type: string }
      responses:
        '201': { description: Role created }
        '409': { description: Role name already exists }
  /roles/{id}/permissions/{module}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: module, in: path, required: true, schema: { type: string } }
    patch:
      summary: Persist a module grant or revocation and append an audit entry (Administrator only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Updated role }
        '400': { description: Invalid role id, module, or boolean value }
        '403': { description: Administrator required }
        '404': { description: Role not found }

  /students:
    get:
      summary: >-
        List students (paginated, searchable, filterable). Results are ownership-scoped: a Parent
        only sees students linked to them via guardianUserId; Administrator/Principal/Teacher/
        Accountant see all students.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: grade, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [Active, Inactive, Alumni] } }
      responses:
        '200':
          description: Paginated student list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Student' } }
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
    post:
      summary: Create a student (Administrator, Principal, Teacher only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Student' }
      responses:
        '201': { description: Student created }
        '400': { description: Validation error }
        '403': { description: Insufficient role }
        '409': { description: refId already exists }
  /students/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a single student by id
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student found }
        '400': { description: Malformed id }
        '404': { description: Not found }
    patch:
      summary: Update a student (Administrator, Principal, Teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
        '403': { description: Insufficient role }
        '404': { description: Not found }
    delete:
      summary: Delete a student (Administrator, Principal only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '403': { description: Insufficient role }
        '404': { description: Not found }

  /students/{id}/documents/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: key, in: path, required: true, schema: { type: string, enum: [id, birth, photo] } }
    put:
      summary: Upload or replace a student document (Administrator, Principal, Teacher only; maximum 4 MB)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Document securely stored in GridFS }
        '400': { description: Invalid key, type, size, or student id }
        '403': { description: Insufficient role }
    get:
      summary: Download a student document (authenticated and student-ownership scoped)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Document bytes }
        '404': { description: Student or document not found, or outside the requester's scope }
    delete:
      summary: Delete a student document (Administrator, Principal, Teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Document deleted }
        '403': { description: Insufficient role }
        '404': { description: Student or document not found }

  # ---- Exams & Gradebook - added this round ----
  /exams:
    get:
      summary: List exam schemes (paginated)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated exam scheme list }
    post:
      summary: Create an exam scheme (Administrator, Principal, or Teacher only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Exam scheme created }
        '403': { description: Insufficient role }
  /exams/{id}/summary:
    get:
      description: Administrator, Principal or Teacher only; no family aggregate disclosure. Pass threshold is normalized by maxMarks.
      summary: >-
        Real-time class statistics for an exam - class average and pass rate, computed via a
        MongoDB aggregation pipeline directly in the database, not pulled into the application
        and reduced in memory.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Aggregate summary: studentCount, classAverage, passCount, passRate' }
  /exams/{id}/publish:
    post:
      summary: Lock and publish an exam. Existing results become visible to linked guardians and receive a portal notification.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published exam and notification count }
        '403': { description: Insufficient role }
  /exams/{id}/reopen:
    post:
      summary: Reopen a locked exam for authorised moderation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reopened exam }
  /exams/{id}/report-cards:
    post:
      description: Optional grade class filter; issued score snapshots are immutable and repeats preserve the original. Not a signed PDF.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grade: { type: string }
      summary: Generate persistent report cards once per student for a published exam; safe to repeat.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Generated and already-existing card counts }
  /exams/{id}/subjects:
    post:
      summary: Add a subject before any results exist (teaching staff only; published exams are locked)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Subject added }
  /exams/{id}/subjects/{subject}:
    delete:
      summary: >-
        Remove a subject from an exam scheme. Rejects removing the last remaining subject (400)
        so every exam scheme retains at least one subject. Published exams or schemes with any results reject changes.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: subject, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Subject removed }
        '400': { description: Cannot remove the last remaining subject }
  /exams/results:
    get:
      summary: >-
        List exam results with average/grade/pass-status computed live from scores at read time -
        never stored, so a corrected mark can never leave a stale grade behind. Ownership-scoped
        like Students/Attendance/Fees.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated results, each with computed averagePercent/grade/passing }
    post:
      summary: >-
        Create a student's complete result for an unlocked exam. Existing records return 409;
        use the versioned register with a correction reason to change saved marks.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Result recorded, with computed fields }
        '400': { description: Unknown subject for this exam, or invalid input }
        '403': { description: Insufficient role, or the exam is locked }
  /exams/{id}/results/{studentId}/notify:
    post:
      summary: Send the existing share-result notification to a linked guardian after publication.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Guardian notification sent }

  # ---- Payroll - added this round ----
  /payroll:
    get:
      summary: >-
        List payslips (paginated, filterable by staff/month/status). Ownership-scoped:
        Administrator/Principal/Accountant see all; any other role (most relevantly Teacher) sees
        only payslips for their own linked staff record. Parent and Student are denied HR/payroll reads.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated payslip list, staff populated }
    post:
      summary: >-
        Generate (or re-generate/correct) a payslip for an active/on-leave staff member and month
        while it is not paid. Corrections require expectedUpdatedAt and correctionReason; amounts use two decimal places and integer-cent arithmetic. Net pay cannot be negative; paid periods are immutable at both the
        service and database query level.
        Administrator, Principal, or Accountant only.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Payslip created or updated, netPay computed and stored }
        '400': { description: Staff is inactive/onboarding, or deductions exceed earnings }
        '404': { description: Staff record not found }
        '409': { description: The payslip period is already paid }
        '403': { description: Insufficient role }
  /payroll/{id}/pay:
    post:
      summary: Record actual external payment of a Processed payslip; no bank transfer initiated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, paidDate, paymentMethod, paymentReference]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                paidDate: { type: string, format: date }
                paymentMethod: { type: string, enum: [Bank transfer, Cash, Cheque, Other] }
                paymentReference: { type: string, minLength: 3, maxLength: 120 }
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Payslip marked Paid, paidDate stamped }
        '409': { description: This payslip has already been paid }

  # ---- Expenses - added this round ----
  /expenses:
    get:
      summary: >-
        List expense claims (paginated, filterable by status/category). Ownership-scoped:
        Administrator/Principal/Accountant see all; any other role sees only claims THEY
        submitted, via their own linked staff record.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated claim list, staff populated }
    post:
      summary: >-
        Submit an expense claim for yourself (Administrator, Principal, Teacher, or Accountant -
        any role with a plausible staff link; Parent/Student cannot). Requires the caller's
        account to actually be linked to a staff record via Staff.userId.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Claim submitted with status Pending }
        '400': { description: No staff record is linked to your account }
        '403': { description: This role cannot submit an expense claim }
  /expenses/{id}/review:
    post:
      summary: >-
        Approve or reject a claim (Administrator, Principal, or Accountant only). Explicitly
        blocks a reviewer from approving their OWN submitted claim, even if they hold a
        review-capable role - a real segregation-of-duties control, not just role gating.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedUpdatedAt, reviewNotes]
              properties:
                status: { type: string, enum: [Approved, Rejected] }
                expectedUpdatedAt: { type: string, format: date-time }
                reviewNotes: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Claim reviewed }
        '403': { description: Insufficient role, OR attempting to review your own claim }
        '409': { description: This claim has already been reviewed }

  # ---- Helpdesk - added this round ----
  /helpdesk:
    get:
      summary: >-
        List tickets (paginated, filterable by status/category). Ownership-scoped: Administrator/
        Principal/Teacher (support roles) see every ticket; any other role sees only tickets they
        personally raised.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated ticket list, raisedBy and assignedTo populated }
    post:
      summary: >-
        Raise a support ticket - open to EVERY authenticated role, including Parent and Student,
        unlike every other module's create endpoint.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Ticket created with status Open }
  /helpdesk/{id}/transition:
    post:
      summary: >-
        Move a ticket to a new status (Administrator, Principal, or Teacher only). Enforces a real
        state machine (see the module's ticket.state-machine.ts): Open->Assigned->Resolved->Closed,
        with Resolved->Assigned as a reopen path. Closed is a genuine terminal state - no
        transition out of it is ever allowed, verified end-to-end through the real API.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Open, Assigned, Resolved, Closed] }
                assignedTo: { type: string }
                resolutionNotes: { type: string }
      responses:
        '200': { description: Ticket updated }
        '400': { description: 'The requested transition is not valid from the ticket''s current status' }
        '403': { description: Insufficient role }

