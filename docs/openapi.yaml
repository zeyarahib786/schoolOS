  # ---- Admissions - added this round ----
  /admissions:
    get:
      summary: List admission applications (paginated, filterable by status) - whole-module staff gate like Visitors
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated application list }
        '403': { description: Insufficient role - applies even to GET }
    post:
      summary: Record a new application (starts as Applied)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Application recorded } }
  /admissions/{id}/transition:
    post:
      summary: >-
        Progress an application through the pipeline. The first BRANCHING state machine in this
        codebase: forward path Applied -> Shortlisted -> Interviewed -> Accepted, with Rejected
        reachable at every active pipeline stage. Waitlist and restore preserve the existing
        UI workflow; required ID, birth certificate and photo are enforced before Accepted. Enrolled is
        deliberately NOT a valid transition target here - enrollment goes through the dedicated
        endpoint below, since it needs refId/roll and creates a real Student.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Application progressed }
        '400': { description: Invalid transition from the application's current status }
  /admissions/{id}/documents/{key}:
    put:
      summary: Upload or replace an existing admission document slot (Administrator, Principal, or Teacher)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string, enum: [id, birth, photo, report, immun, tc] } }]
      responses: { '201': { description: Document securely stored in GridFS } }
    get:
      summary: Download an admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Document content } }
    delete:
      summary: Remove an admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Document removed } }
  /admissions/{id}/documents/{key}/mark-received:
    post:
      summary: Record verified receipt of a paper admission document
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Paper document receipt recorded } }
  /admissions/{id}/enroll:
    post:
      summary: >-
        Enroll an Accepted applicant - the symmetric MIRROR of Alumni's graduation transaction:
        creates a brand-new Student (carrying the application's own name/grade/gender/guardian/
        phone) and flips the application to Enrolled together, or neither happens. Proven both
        sides: the created Student is fetched back and its fields verified against the
        application's data; and a failed enrollment (duplicate refId, 409) provably leaves the
        application still Accepted - rolled back, not half-applied.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Applicant enrolled, Student created, application links to it }
        '400': { description: Only an Accepted application can be enrolled }
        '409': { description: A student with this refId already exists (transaction rolled back) }

  # ---- Leave (staff leave) - added this round ----
  /leave:
    get:
      summary: >-
        List leave requests. Approvers (Administrator/Principal) see all; everyone else sees only
        their own via their linked Staff record (Staff.userId, the Payroll/Expenses self-service
        shape) - and a requester with NO linked record matches nothing (fail closed), not
        everything.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated leave list, staff populated with balance } }
    post:
      summary: >-
        Request leave for yourself - any authenticated user with a linked Staff record; Administrator
        or Principal may submit the existing HR form for a selected active staff member. The day
        count is computed as an INCLUSIVE calendar count (same from/to date = 1 day; time-of-day
        stripped so 23:59 -> 00:01 is still 2 days) and STORED at request time like Payroll's
        netPay: an approved leave's size is a historical record that must not silently change if
        the counting rule ever does. Inverted ranges are rejected by a cross-field Zod refinement.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Leave requested, day count stored, status Pending }
        '400': { description: No linked staff record, or invalid range }
  /leave/{id}/decide:
    post:
      summary: >-
        Approve or deny a leave request. The approver gate (Administrator/Principal ONLY) is the
        first write-side rule that is a strict SUBSET of WRITE_ROLES - a Teacher can request but
        never decide. Self-approval prevention like Expenses, but stricter in one respect: an
        approver cannot decide their OWN request even to DENY it. Approval deducts the stored day
        count from the staff member's annualLeaveRemaining via Cafeteria's guarded-decrement
        technique ($gte guard + $inc in one findOneAndUpdate) applied at APPROVAL time - proven
        under real concurrency (two simultaneous approvals, exactly one lands, balance never
        negative) and proven to deduct exactly once across a double-decide attempt (409 on the
        second, balance unchanged). An insufficient balance fails the approval with 400 and the
        request stays Pending.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Decision recorded; balance deducted if approved }
        '400': { description: Insufficient leave balance }
        '403': { description: Not an approver, or deciding your own request }
        '409': { description: Already decided }

  # ---- Meetings (parent-teacher) - added this round ----
  /meetings:
    get:
      summary: >-
        List meeting slots (onlyOpen filter available). Open read like Timetable - a bookable
        slot only has value if parents can browse it.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated slot list, teacher and booked student populated } }
    post:
      summary: >-
        Publish a bookable slot (Administrator, Principal, or Teacher only). The same teacher
        cannot publish two slots at the same date+time - compound uniqueness preventing
        double-publication, 409 on conflict.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Slot published, open for booking }
        '409': { description: This teacher already has a slot at that date and time }
  /meetings/{id}/book:
    post:
      summary: >-
        Book an open slot - ONLY a Parent may book (mirroring LMS's only-Student-submits
        asymmetry), and only for a student genuinely linked to them via guardianUserId - resolved
        server-side, never trusted from the request body. The claim is Library's atomic-guard
        technique applied to booking: availability check and claim are ONE findOneAndUpdate
        guarded on bookedBy null, proven under a real two-parent race (exactly one 200, one 409).
        The failure path distinguishes a nonexistent slot (404) from an already-booked one (409)
        with a follow-up query made only on failure, keeping the happy path single-operation.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Slot booked for the parent's child }
        '403': { description: Not a Parent, or not your child }
        '404': { description: Meeting slot not found }
        '409': { description: Slot already booked }

  # ---- Documents (versioned registry) - added this round ----
  /documents:
    get:
      summary: >-
        List documents. By default shows ONLY the current version of each code; includeSuperseded
        reveals full version history. Filterable by category and code (case-normalized). Open
        read - policies, forms, and circulars exist to be consulted by everyone.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated document list, publishedBy populated } }
    post:
      summary: >-
        Publish a document (Administrator, Principal, or Teacher only). Publishing an existing
        code supersedes the current version and creates version N+1. The "at most one current
        version per code" invariant is enforced at the DATABASE layer with a PARTIAL UNIQUE
        INDEX - a technique used nowhere else in this codebase: uniqueness on code applies only
        to isCurrent:true records, so superseded versions coexist freely while two concurrent
        "current" inserts can never both land (loser gets 11000 -> 409, with a best-effort
        compensating restore of the previous version so a lone transient failure can't leave a
        code with no current version). Race proven end-to-end with the invariant checked after:
        exactly one current version remains. Codes must look like POL-001 and are normalized to
        uppercase.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Version published as current; previous version superseded }
        '409': { description: Concurrent publish for this code - retry }
  /documents/file:
    post:
      summary: Publish a document version with an attached PDF (Administrator, Principal, Teacher)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string }, description: URI-encoded PDF filename }
        - { name: X-Document-Code, in: header, required: true, schema: { type: string } }
        - { name: X-Document-Title, in: header, required: true, schema: { type: string } }
        - { name: X-Document-Category, in: header, required: true, schema: { type: string, enum: [Policy, Form, Circular, Guideline] } }
        - { name: X-Document-Description, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Version and PDF stored }
        '400': { description: Invalid PDF or metadata }
        '403': { description: Not a publishing role }
  /documents/{id}/file:
    get:
      summary: Download an exact document version's PDF (all authenticated roles)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF attachment
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Record not found or no PDF attached }

  # ---- ID Cards - added this round ----
  /id-cards:
    get:
      summary: >-
        List ID cards (filterable by status/subjectType) - whole-module staff gate: cards carry
        personal data and issuance is front-office work. One collection spans BOTH holder kinds:
        the first POLYMORPHIC reference in this codebase (subjectType holds the literal model
        name, subject resolves through Mongoose refPath), so a single list interleaves cards
        whose holders populate from the Students and Staff collections respectively - proven
        end-to-end with both kinds in one response.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated card list, holder populated per record via refPath } }
    post:
      summary: >-
        Issue a card. Holder existence is checked in the RIGHT collection (a real Staff id passed
        as a Student subject is a 404, proven); expiry must be in the future; serials are
        sequential via the Counter technique (CARD-YYYY-000001). One ACTIVE card per holder,
        enforced with the partial-unique technique (recognized from Documents, reused): the
        holder's full Lost/Revoked history coexists while a second Active issuance gets 409. A
        fresh issuance genuinely links `replaces` to the holder's most recent Lost/Revoked card,
        making a card's lineage traceable - proven end-to-end (report lost -> reissue -> the new
        card's replaces equals the lost card's id).
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Card issued Active, serial assigned, lineage linked }
        '400': { description: Expiry in the past }
        '404': { description: Holder not found in the specified collection }
        '409': { description: Holder already has an active card }
  /id-cards/{id}/report-lost:
    post:
      summary: Report an Active card lost - only Active cards can be reported (409 otherwise, proven for the double-report case)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Card marked Lost; the holder can now be issued a replacement }
        '409': { description: Card is not Active }
  /id-cards/{id}/revoke:
    post:
      summary: Revoke an Active card (same Active-only rule as report-lost)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Card revoked }
        '409': { description: Card is not Active }

  # ---- Reports - added this round ----
  /reports/overview:
    get:
      summary: >-
        School-wide overview - the first true CROSS-COLLECTION read aggregation in this codebase:
        five independent $group pipelines (Students by status with $avg gpa/attendance over
        Active students, Staff by type, Invoices by status with amounts summed, Tickets by
        status, Attendance by month) run in parallel and composed. Monthly attendance rates
        cover the latest six months; Excused marks are excluded from the denominator and
        months without eligible marks have a null rate. Averages are computed by the DATABASE, not by
        loading documents into application memory. Also the first management-only READ: the
        Administrator/Principal subset Leave uses for its write side, applied to reading - even a
        Teacher gets 403 (proven). Aggregation correctness proven over real created data: two
        students -> Active count 2 with numeric averages; one 2500 invoice -> Pending count 1,
        totalAmount 2500.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Composed overview across students, staff, fees, helpdesk }
        '403': { description: Only Administrator or Principal }

  # ---- Settings - added this round ----
  /settings:
    get:
      summary: >-
        School-wide settings - the first SINGLETON document in this codebase (fixed string _id,
        the Counter model's string-_id technique applied to "exactly one of this thing"). GET
        before any save returns honest defaults rather than a 404 every client would special-case.
        Open read: school name and academic year are basic context for everyone.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current settings or defaults } }
    put:
      summary: >-
        Update settings - the first ADMINISTRATOR-ONLY gate in this codebase: even Principal gets
        403 (proven), because school-wide configuration has system-wide blast radius. The write is
        an upsert against the fixed _id, so two saves provably leave exactly ONE document with the
        latest values. Every change is written to the audit log as a Warning naming the Settings
        module and the actor server-side - proven end-to-end by reading the entry back through
        the Audit module's own API.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings saved (created on first save); audit entry written }
        '400': { description: Invalid payload (e.g. malformed academic year) }
        '403': { description: Only an Administrator }

  # ---- Messages - added this round (FINAL module, 36 of 36) ----
  /messages:
    get:
      summary: >-
        List your correspondence. BIDIRECTIONAL $or ownership - you see a message iff you are its
        sender OR its recipient - with, uniquely in this codebase, NO administrative override:
        the scoping function takes no role parameter at all, so an Administrator's view is
        exactly as narrow as anyone else's (proven: an Administrator cannot see a message between
        two other users). Box filter: inbox (recipient=you), sent (sender=you), all ($or).
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'Paginated messages, both parties populated' } }
    post:
      summary: >-
        Send a message by recipient email. A nonexistent recipient is 404; messaging yourself is
        400. No role gate - every authenticated user can correspond.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Message sent, unread }
        '400': { description: Cannot message yourself }
        '404': { description: No user with that email }
  /messages/{id}/read:
    post:
      summary: >-
        Mark a message read - ONLY the recipient. The sender gets 403; a NON-PARTY (even an
        Administrator) gets 404 rather than 403, because for a non-party the message is
        indistinguishable from nonexistent - a 403 would leak that it exists. Both distinctions
        proven. Idempotent: marking an already-read message returns it unchanged.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: readAt set (or already set) }
        '403': { description: Sender cannot mark their own message read }
        '404': { description: Not found, or not a party to it }
  /guardians:
    get:
      summary: List persisted guardian profiles with populated linked students (Administrator/Principal)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated guardian directory }
        '403': { description: Leadership role required }
  /guardians/broadcasts:
    get:
      summary: List persisted parent broadcasts
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated broadcasts } }
    post:
      summary: Send an in-app audience-targeted broadcast and atomically append it to every matching guardian thread
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Broadcast and recipient thread messages persisted }
        '400': { description: No matching guardians, incomplete audience filter, or unconfigured Email/SMS channel }
  /guardians/{id}/portal:
    patch:
      summary: Activate or suspend the existing guardian portal control
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Guardian portal status updated and audited }
        '404': { description: Guardian not found }
  /guardians/{id}/messages:
    get:
      summary: Read the persisted conversation thread for one guardian
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Chronological guardian thread } }
    post:
      summary: Persist a reply in the existing guardian conversation drawer
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Reply persisted and audited }
        '404': { description: Guardian not found }
  /meetings/{id}/book-on-behalf:
    post:
      summary: Leadership books an Available PTM slot for a guardian and one of their linked students
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Slot booked Confirmed }
        '400': { description: Guardian/student link mismatch }
        '409': { description: Slot is no longer available }
  /meetings/{id}/confirm:
    post:
      summary: Confirm a Pending PTM slot
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Meeting confirmed }, '409': { description: Slot is not Pending } }
  /meetings/{id}/cancel:
    post:
      summary: Cancel a booked PTM and return the slot to Available
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Booking cleared }, '409': { description: Slot is already Available } }
  /meetings/{id}/reschedule:
    post:
      summary: Atomically move a booking to an Available slot belonging to the same teacher
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Booking moved }, '409': { description: Target unavailable or different teacher } }
  /meetings/{id}/notify:
    post:
      summary: Audit the existing PTM participant reminder action
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Participants notified }, '409': { description: Available slot has no participants } }
