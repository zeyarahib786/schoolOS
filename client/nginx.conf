server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ /index.html; }

    # Keep the browser and API on one public origin. The Docker service name is
    # resolved by Docker's internal DNS; no client-side CORS configuration is
    # needed for a deployed stack.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Vite hashes these build assets. Stable copied paths and HTML must revalidate.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        expires 1y;
    }
    location = /index.html { expires -1; }
    location ~* \.(js|css|svg|woff2?)$ { expires -1; }
}
