name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server:
    name: Server - format, lint, typecheck, unit test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (no external dependencies required)
        run: npm run test:unit
      - name: Integration tests (requires MongoDB - provided by CI runner's open network access)
        run: npm run test:integration:all
      - run: npm run build
      - name: Dependency security audit
        run: npm audit --audit-level=high

  client:
    name: Client - typecheck, unit test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Dependency security audit
        run: npm audit --audit-level=high

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t schoolos-api:ci ./server
      - run: docker build -t schoolos-web:ci ./client
