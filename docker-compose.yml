services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # --replSet: the Facilities & Bookings module uses a real MongoDB transaction to prevent
    # double-booking (see docs/reference/openapi.yaml's note on POST /facilities/bookings) - transactions
    # require a replica set, which a plain standalone mongod will reject outright.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo:27017", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]

  # One-shot demo-data seeder. Not started by `docker compose up` - run it explicitly, once the
  # stack is up, with:   docker compose --profile seed run --rm seed
  # It reuses the api image (so the compiled dist/seed/seed.js is guaranteed present - the seed
  # deliberately does NOT depend on devDependencies or src/, which the production image omits).
  seed:
    build:
      context: ./server
      target: production
    profiles: ["seed"]
    depends_on:
      mongo-init-replica:
        condition: service_completed_successfully
    environment:
      # This profile is solely for the local fictional dataset, never a real school.
      NODE_ENV: test
      LOG_LEVEL: info
      MONGO_URI: mongodb://mongo:27017/schoolos
      # Reuse validated configuration; seed execution does not start the API.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real 32+ char secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a different real 32+ char secret in .env}
    command: ["node", "dist/seed/seed.js"]
    restart: "no"

  api:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      MONGO_URI: mongodb://mongo:27017/schoolos
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real 32+ char secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a different real 32+ char secret in .env}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 5000
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/ready',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./client
      target: production
      args:
        # Browser requests stay on the public SchoolOS origin. Nginx forwards
        # this path to the internal API service, so production never embeds a
        # developer's localhost address into the static bundle.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
